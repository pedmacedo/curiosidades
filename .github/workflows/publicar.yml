# Publica o app no GitHub Pages a cada push na branch main.
# Roda os testes, gera app/data/ com o construir_dados_app.py (que também valida os fatos)
# e publica só a pasta app/. Se algum teste ou a validação falhar, nada é publicado.
name: Publicar o app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Dois jobs, como no modelo oficial do GitHub Pages: com tudo num job só, o deploy-pages
# às vezes procurava o pacote 1 s depois do envio e não o achava ("No artifacts named
# github-pages"). A troca de job dá tempo para o pacote ficar visível.
jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes (Python e JavaScript)
        run: |
          python -m unittest discover -s testes
          node --test testes/recomendador.test.mjs

      - name: Gerar os dados do app
        run: python pipeline/construir_dados_app.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v5
